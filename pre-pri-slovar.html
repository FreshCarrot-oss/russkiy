<div id="app"></div>

<template id="rules">
  <article class="card rule">
    <h3>Общее правило</h3>
    <div class="ab">
      <div><b>ПРЕ</b><span>= «очень» (премилый)<br>= «пере» (преградить)</span></div>
      <div><b>ПРИ</b><span>приближение, присоединение, неполнота действия, доведение до конца</span></div>
    </div>
    <p>В словах из этого списка правило часто не срабатывает напрямую: смысл приставки стёрся или слово пришло из другого языка. Поэтому слова разбиты на группы, которые проще запомнить вместе. Приставки по правилу тренируются в теме «Приставки».</p>
  </article>
  <article class="card rule">
    <h3>Не перепутай</h3>
    <p><w>пр[и]видение</w> — призрак. Пишется с И, как и <w>пр[и]ведение</w> от «привести».</p>
    <p>«Президент», «презентация», «претензия» похожи на слова с ПРИ, но это латинские заимствования, все на ПРЕ.</p>
    <p><w>пр[е]имущество</w> пишется через ПРЕ, хотя близкое по смыслу <w>пр[и]оритет</w> — через ПРИ.</p>
  </article>
</template>

<script src="assets/core.js"></script>
<script src="assets/trainer.js"></script>
<script>

  lati: { h: 'Иноязычные слова с ПРИ', p: 'Тоже заимствования, но с корнями prim-, priv-, prior-. Привилегия и приватный от лат. privus — «отдельный, частный», приоритет от prior — «первый».' },
  very: { h: 'ПРЕ = «очень»', p: 'Приставку можно заменить словом «очень»: прелестный — очень лестный, преподобный — очень подобный (праведный).' },
  pere: { h: 'ПРЕ ≈ «пере-» и «препятствие»', p: 'Смысл «через, поперёк, мешать»: преследовать — идти по следам, препятствие и препона мешают пройти, преткновение — «спотыкание», знаки препинания «препинают» (останавливают) речь.' },
  near: { h: 'ПРИ = приближение, присоединение, добавление', p: 'Привлекательный — притягивает к себе, приумножить — прибавить, приурочить — приблизить к сроку, неприступный — нельзя взять приступом.' },
  dict: { h: 'Словарные слова', p: 'Значение приставки уже не слышно. Запоминаем написание наизусть, лучше в паре с родственным словом.' },

  {"t": "пр#вередливый, пр#вереда", "a": "и", "c": "и", "g": "dict"},

  {"t": "пр#оритет", "a": "и", "c": "и", "g": "lati", "h": "= преимущество", "n": "Преимущество"},
