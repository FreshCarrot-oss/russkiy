<body>
<div id="app"></div>

<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 6</h3>
    <p>Дано предложение с лексической ошибкой. Бывает два варианта задания:</p>
    <ul>
      <li><b>Исключите лишнее слово</b> и выпишите его. Это плеоназм: значение слова уже есть в другом слове. «Свободная вакансия» — вакансия и есть свободное место.</li>
      <li><b>Замените неверно употреблённое слово</b>. Это нарушение сочетаемости: «играть значение» вместо «иметь значение» или «играть роль».</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Как найти лишнее слово</h3>
    <p>Переведи заимствованное слово на русский: сувенир — подарок на память, значит «памятный сувенир» — повтор. Автобиография — описание своей жизни, значит «моя автобиография» — повтор. Месяц май — «в мае месяце» — повтор.</p>
  </article>
  <article class="card rule">
    <h3>Смешение двух выражений</h3>
    <div class="tablewrap"><table class="t">
      <tr><th>Ошибка</th><th>Правильно</th></tr>
      <tr><td>играть значение</td><td>иметь значение, играть роль</td></tr>
      <tr><td>оплатить за проезд</td><td>оплатить проезд, заплатить за проезд</td></tr>
      <tr><td>предпринять меры</td><td>принять меры, предпринять попытку</td></tr>
      <tr><td>оказать заботу</td><td>проявить заботу, оказать помощь</td></tr>
      <tr><td>совершить победу</td><td>одержать победу</td></tr>
    </table></div>
  </article>
</template>

<script src="assets/core.js"></script>
<script src="assets/trainer.js"></script>
<script>
/* Лишнее слово: [словосочетание, лишнее слово, пояснение] */
const PLEO = [
  ['свободная вакансия', 'свободная', 'Вакансия — свободное место.'],
  ['памятный сувенир', 'памятный', 'Сувенир — подарок на память.'],
  ['моя автобиография', 'моя', 'Автобиография — описание своей жизни.'],
  ['главная суть', 'главная', 'Суть — самое главное.'],
  ['впервые дебютировать', 'впервые', 'Дебют — первое выступление.'],
  ['народный фольклор', 'народный', 'Фольклор — народное творчество.'],
  ['период времени', 'времени', 'Период — промежуток времени.'],
  ['в мае месяце', 'месяце', 'Май — и так месяц.'],
  ['предварительно запланировать', 'предварительно', 'Запланировать — уже заранее.'],
  ['коллега по работе', 'по работе', 'Коллега — тот, с кем работаешь.'],
  ['прейскурант цен', 'цен', 'Прейскурант — список цен.'],
  ['ведущий лидер', 'ведущий', 'Лидер — тот, кто ведёт.'],
  ['подниматься вверх', 'вверх', 'Подниматься можно только вверх.'],
  ['спуститься вниз', 'вниз', 'Спуститься можно только вниз.'],
  ['вернуться назад', 'назад', 'Вернуться — прийти назад.'],
  ['отступать назад', 'назад', 'Отступать — двигаться назад.'],
  ['передовой авангард', 'передовой', 'Авангард — передовая часть.'],
  ['совместное сотрудничество', 'совместное', 'Сотрудничество и есть совместная работа.'],
  ['первая премьера', 'первая', 'Премьера — первый показ.'],
  ['хронометраж времени', 'времени', 'Хронометраж — измерение времени.'],
  ['биография жизни', 'жизни', 'Биография — описание жизни.'],
  ['ностальгия по родине', 'по родине', 'Ностальгия — тоска по родине.'],
  ['мемориальный памятник', 'мемориальный', 'Мемориал — памятник.'],
  ['главный лейтмотив', 'главный', 'Лейтмотив — главная мысль.'],
  ['очень оптимальные сроки', 'очень', 'Оптимальный — наилучший, степени у него нет. Этот пример был в демоверсии ЕГЭ-2026.'],
  ['самый оптимальный вариант', 'самый', 'Оптимальный — уже наилучший.'],
  ['необычный феномен', 'необычный', 'Феномен — необычное явление.'],
  ['пернатые птицы', 'пернатые', 'Все птицы пернатые.'],
  ['юный вундеркинд', 'юный', 'Вундеркинд — одарённый ребёнок.'],
  ['в конечном итоге', 'конечном', 'Итог — конечный результат.'],
  ['реальная действительность', 'реальная', 'Действительность — то, что реально существует.'],
  ['неожиданный сюрприз', 'неожиданный', 'Сюрприз — неожиданность.'],
  ['упал вниз', 'вниз', 'Упасть можно только вниз.'],
  ['заранее предвидеть', 'заранее', 'Предвидеть — знать заранее.'],
  ['внутренний интерьер', 'внутренний', 'Интерьер — внутреннее убранство.'],
  ['местный абориген', 'местный', 'Абориген — коренной местный житель.'],
  ['старый ветеран', 'старый', 'Ветеран — давний, опытный участник.'],
  ['очень огромный', 'очень', 'Огромный — уже очень большой.'],
];
/* Сочетаемость: [словосочетание с #, верное слово, варианты, пояснение] */
const COMB = [
  ['# победу', 'одержать', 'одержать|совершить', 'Одержать победу. «Совершить» сочетается с подвигом, поступком.'],
  ['# значение', 'иметь', 'иметь|играть', 'Иметь значение, но играть роль.'],
  ['# роль', 'играть', 'играть|иметь', 'Играть роль, но иметь значение.'],
  ['# внимание на ошибки', 'обращать', 'обращать|уделять', 'Обращать внимание на что-то; уделять внимание чему-то.'],
  ['# внимание учёбе', 'уделять', 'уделять|обращать', 'Уделять внимание чему-то; обращать внимание на что-то.'],
  ['# меры', 'принять', 'принять|предпринять', 'Принять меры, но предпринять попытку.'],
  ['# попытку', 'предпринять', 'предпринять|принять', 'Предпринять попытку, но принять меры.'],
  ['# впечатление', 'произвести', 'произвести|сделать', 'Произвести впечатление.'],
  ['# доклад на конференции', 'сделать', 'сделать|провести', 'Сделать доклад, но провести урок, собрание.'],
  ['# урок', 'провести', 'провести|сделать', 'Провести урок.'],
  ['# бокал за юбиляра', 'поднять', 'поднять|произнести', 'Поднять бокал, но произнести тост.'],
  ['# помощь', 'оказать', 'оказать|сделать', 'Оказать помощь.'],
  ['# заботу о детях', 'проявить', 'проявить|оказать', 'Проявить заботу, но оказать помощь.'],
  ['# значение мелочам', 'придавать', 'придавать|уделять', 'Придавать значение чему-то.'],
  ['# требования', 'предъявить', 'предъявить|предоставить', 'Предъявить требования, претензии.'],
  ['# поражение', 'потерпеть', 'потерпеть|получить', 'Потерпеть поражение, но получить ранение.'],
  ['# ранение', 'получить', 'получить|потерпеть', 'Получить ранение.'],
];
const words = (t, a) => { const rest = t.replace(a, ' ').split(' ').filter(Boolean); return [a].concat(rest); };
Trainer.start({
  id: 'leksicheskie-normy',
  kind: 'choice',
  title: 'Лишнее слово и сочетаемость',
  eyebrow: 'ЕГЭ · задание 6 · лексические нормы',
  prompt: 'Найди лишнее слово или выбери подходящее',
  source: 'Примеры — по толковым словарям и словарю сочетаемости слов русского языка.',
  categories: [{ key: 'pleo', label: 'Лишнее слово' }, { key: 'comb', label: 'Сочетаемость' }],
  autoNext: false,
  exam: { type: 'odd', task: 6, points: 1, q: 'В одном из словосочетаний ниже нарушена лексическая сочетаемость. Найдите его и замените выделенное слово.' },
  items: PLEO.map(([t, a, n]) => ({ t, a, o: words(t, a), n, c: 'pleo' }))
    .concat(COMB.map(([t, a, o, n]) => ({ t, a, o: o.split('|'), n, c: 'comb' }))),
});
</script>
</body>
