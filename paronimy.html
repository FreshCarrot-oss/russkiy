  <article class="card rule">
    <h3>Что такое паронимы</h3>
    <p>Однокоренные слова одной части речи, которые звучат похоже, но значат разное: <b>абонемент</b> — документ на право пользования, <b>абонент</b> — человек, который пользуется. Перепутать их — лексическая ошибка.</p>
  </article>
  <article class="card rule">
    <h3>Как устроено задание 5</h3>
    <p>Даны пять предложений с выделенным словом. В одном слово употреблено неверно. Нужно найти его и записать вместо него подходящий пароним.</p>
    <ul>
      <li>Все слова берутся из «Списка паронимов» ФИПИ. Здесь в тренажёре именно этот список, 144 строки.</li>
      <li>Ответ пишется в той же форме, что и выделенное слово: если выделено «ГАРАНТИЙНОГО», ответ — «гарантированного».</li>
      <li>Ответ засчитывается, только если он написан без орфографических ошибок.</li>
      <li>Бывает, что в каком-то контексте подходят оба слова. В задании правильным считается только тот пароним, который заменить нельзя.</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Как различать</h3>
    <div class="ab">
      <div><b>-ический</b><span>относящийся к чему-то: драматический театр, практические занятия</span></div>
      <div><b>-ичный</b><span>обладающий качеством: драматичная ситуация, практичный человек</span></div>
    </div>
    <div class="ab">
      <div><b>-ливый, -чивый</b><span>свойство человека: удачливый, доверчивый, памятливый</span></div>
      <div><b>-ный</b><span>свойство предмета или события: удачный, доверительный, памятный</span></div>
    </div>
    <p>Подставь определение: «драматический» — «относящийся к драме», «драматичный» — «напряжённый, как в драме». Подходит только одно.</p>
  </article>
  <article class="card rule">
    <h3>Самые частые ловушки</h3>
    <ul>
      <li><b>Надеть</b> что-то (шапку), <b>одеть</b> кого-то (ребёнка). Надеть одежду, одеть Надежду.</li>
      <li><b>Оплатить</b> что: оплатить проезд. <b>Заплатить</b> за что: заплатить за проезд. «Оплатить за проезд» — ошибка.</li>
      <li><b>Предоставить</b> — дать в пользование (слово, отпуск). <b>Представить</b> — показать, познакомить, вообразить (проект, гостя).</li>
      <li><b>Эффективный</b> — дающий результат. <b>Эффектный</b> — производящий впечатление.</li>
      <li><b>Абонемент</b> — документ, <b>абонент</b> — человек. <b>Адресат</b> — получатель, <b>адресант</b> — отправитель.</li>
    </ul>
