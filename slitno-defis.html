  <article class="card rule">
    <h3>Как устроено задание 14</h3>
    <p>Даны пять рядов по два слова, часть слова в скобках: «(В)ТЕЧЕНИЕ дня, ЧТО(БЫ) успеть». Нужно выбрать ряды, где оба слова пишутся слитно. Бывает и вариант «раздельно» или «через дефис». Сначала определи часть речи по смыслу всего предложения.</p>
  </article>
  <article class="card rule">
    <h3>Пары, которые путают</h3>
    <div class="tablewrap"><table class="t">
      <tr><th>Слитно</th><th>Раздельно</th></tr>
      <tr><td>чтобы успеть (цель)</td><td>что бы ни случилось; что бы ты хотел?</td></tr>
      <tr><td>я тоже пойду (= и я)</td><td>то же самое (местоимение + частица)</td></tr>
      <tr><td>зато вечером (= но)</td><td>за то письмо (предлог + местоимение)</td></tr>
      <tr><td>он также пришёл (= тоже)</td><td>так же, как и я (сравнение)</td></tr>
      <tr><td>прийти вовремя (= в срок)</td><td>во время урока (когда)</td></tr>
      <tr><td>навстречу ветру (предлог), идти навстречу</td><td>на встречу с друзьями (куда)</td></tr>
      <tr><td>вследствие болезни (= из-за)</td><td>в следствии по делу (в расследовании)</td></tr>
      <tr><td>ввиду дождя (= из-за)</td><td>иметь в виду</td></tr>
      <tr><td>насчёт поездки (= о)</td><td>деньги на счёт в банке</td></tr>
    </table></div>
  </article>
  <article class="card rule">
    <h3>Предлоги на -е и -и</h3>
    <p>В течени<mark>е</mark>, в продолжени<mark>е</mark>, вследстви<mark>е</mark> — на конце Е. В заключени<mark>е</mark> доклада — тоже Е. Раздельно пишутся: в течение, в продолжение, в заключение, в связи, в силу. Слитно: вследствие, ввиду, вместо, вроде, наподобие, насчёт.</p>
  </article>
  <article class="card rule">
    <h3>Через дефис</h3>
    <ul>
      <li>По- + прилагательное на -ому/-ему/-ски/-цки/-ьи: по-моему, по-русски, по-лисьи.</li>
      <li>В-/во- + порядковое числительное: во-первых, в-третьих.</li>
      <li>Кое-, -то, -либо, -нибудь, -таки: кое-где, где-то, кто-нибудь, всё-таки. Если после кое- стоит предлог, пишется раздельно: кое с кем.</li>
      <li>Пол- перед гласной, Л и заглавной буквой: пол-арбуза, пол-лимона, пол-Москвы; в остальных случаях слитно: полдома.</li>
      <li>Сложные прилагательные из равноправных частей или со значением оттенка: русско-английский, светло-зелёный. Если первая часть подчиняется второй — слитно: железнодорожный, сельскохозяйственный.</li>
    </ul>
  </article>
