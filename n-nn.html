<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 15</h3>
    <p>Дано предложение с пропусками, пронумерованными цифрами в скобках. Нужно записать цифры, на месте которых пишется НН. Иногда спрашивают наоборот — где пишется одна Н. Внимательно читай формулировку: в тренажёре встречаются оба варианта.</p>
  </article>
  <article class="card rule">
    <h3>Сначала определи часть речи</h3>
    <div class="tablewrap"><table class="t">
      <tr><th>Слово образовано</th><th>Пишется</th></tr>
      <tr><td>от существительного</td><td>смотри суффикс: -ан-, -ян-, -ин- → Н (кожаный, гусиный); -онн-, -енн- и корень на Н + Н → НН (дискуссионный, клюквенный, туманный)</td></tr>
      <tr><td>от глагола, и есть приставка, зависимое слово, суффикс -ова-/-ева- или глагол совершенного вида</td><td>НН — это причастие: выкрашенный забор, жаренная на масле картошка, маринованный, решённый</td></tr>
      <tr><td>от глагола, но ничего из этого нет</td><td>Н — это отглагольное прилагательное: крашеный забор, жареная картошка</td></tr>
    </table></div>
  </article>
  <article class="card rule">
    <h3>Исключения, которые нужно знать наизусть</h3>
    <ul>
      <li>НН у прилагательных на -ян-: <b>стеклянный, оловянный, деревянный</b>.</li>
      <li>Н у прилагательных: <b>ветреный</b> (но безветренный), <b>юный, свиной, румяный, пряный, багряный, зелёный</b>.</li>
      <li>НН без приставки: <b>нежданный, негаданный, невиданный, неслыханный, медленный, священный, чеканный, жеманный, желанный</b>.</li>
      <li>Н с приставкой: <b>смышлёный, названый брат, посажёный отец</b>.</li>
      <li><b>Кованый, жёваный</b> — Н: -ов-/-ёв- здесь часть корня. Но с приставкой — НН: подкованный.</li>
      <li>НЕ не превращает прилагательное в причастие: <b>некошеный луг</b>, но <b>нескошенный</b> — приставка с-.</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Краткие формы и наречия</h3>
    <ul>
      <li>Краткое причастие — всегда одна Н: задача решена, статья напечатана.</li>
      <li>Краткое прилагательное — столько же, сколько в полной форме: ночь туманна, девушка образованна (умна и образованна).</li>
      <li>Наречие на -о — как в слове, от которого оно образовано: взволнованно (взволнованный), ветрено (ветреный).</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Существительные</h3>
    <p>Пишется столько Н, сколько в слове, от которого образовано существительное: гостиница (гость + -ин-), масленица (масленый), но конница (конный), бесприданница (бесприданный). С суффиксом -ник: воспитанник (воспитанный), избранник (избранный), но с одной Н — труженик, вареники (варёный).</p>
  </article>
</template>

<script>
const GROUPS = {
  an:    { h: 'Суффиксы -ан-, -ян-, -ин-', p: 'Прилагательные от существительных с суффиксами -ан-, -ян-, -ин- пишутся с одной Н.' },
  enn:   { h: 'Суффиксы -онн-, -енн-', p: 'Прилагательные с суффиксами -онн-, -енн- пишутся с НН.' },
  root:  { h: 'Корень на Н + суффикс -н-', p: 'Если корень оканчивается на Н и добавляется суффикс -н-, получается НН: туман + н = туманный.' },
  ex1:   { h: 'Исключения с НН', p: 'Стеклянный, оловянный, деревянный пишутся с НН, хотя суффикс -ян-.' },
  ex2:   { h: 'Исключения с Н', p: 'Ветреный (но безветренный), юный, свиной, румяный, пряный, багряный, зелёный — с одной Н.' },
  part:  { h: 'Причастие: НН', p: 'Есть приставка, зависимое слово, суффикс -ова-/-ева- или глагол совершенного вида без приставки — значит, это причастие, пишется НН.' },
  adj:   { h: 'Отглагольное прилагательное: Н', p: 'Образовано от глагола, но нет ни приставки, ни зависимых слов, ни -ова-/-ева-, глагол несовершенного вида — пишется одна Н.' },
  perf:  { h: 'Глагол совершенного вида: НН', p: 'Решить, бросить, купить, лишить, дать — совершенного вида. Причастия от них пишутся с НН даже без приставки: решённый, брошенный.' },
  kov:   { h: 'Кованый, жёваный', p: '-ов-/-ёв- здесь часть корня, а не суффикс -ова-. Без приставки пишется одна Н.' },
  ex3:   { h: 'НН без приставки (исключения)', p: 'Нежданный, негаданный, невиданный, неслыханный, медленный, священный, чеканный, жеманный, желанный.' },
  ex4:   { h: 'Н с приставкой (исключения)', p: 'Смышлёный, названый брат, посажёный отец.' },
  ne:    { h: 'НЕ ничего не меняет', p: 'Приставка НЕ не делает слово причастием: некошеный, некрашеный. Но если есть другая приставка — НН: нескошенный.' },
  short: { h: 'Краткая форма', p: 'Краткое причастие — одна Н (решена). Краткое прилагательное — как в полной форме (туманна, образованна).' },
  adv:   { h: 'Наречие на -о', p: 'Столько Н, сколько в слове, от которого образовано наречие.' },
  noun:  { h: 'Существительное', p: 'Столько Н, сколько в слове, от которого образовано существительное.' },
};
/* [текст с пропуском #, н или нн, группа, пояснение] */
const N = [
  /* прилагательные от существительных */
  ['кожа#ый ремень', 'н', 'an'], ['серебря#ое кольцо', 'н', 'an'], ['гуси#ое перо', 'н', 'an'], ['лебеди#ая шея', 'н', 'an'],
  ['песча#ый берег', 'н', 'an'], ['масля#ая краска', 'н', 'an', 'Масляный — от «масло» с суффиксом -ян-.'], ['ветря#ая мельница', 'н', 'an'],
  ['торфя#ое болото', 'н', 'an'], ['полотня#ый мешок', 'н', 'an'], ['овся#ая каша', 'н', 'an'],
  ['соломе#ая шляпа', 'нн', 'enn'], ['клюкве#ый морс', 'нн', 'enn'], ['дискуссио#ый вопрос', 'нн', 'enn'], ['революцио#ые идеи', 'нн', 'enn'],
  ['утре#ий туман', 'нн', 'enn'], ['лимо#ый сок', 'нн', 'root'], ['тума#ое утро', 'нн', 'root'], ['со#ый взгляд', 'нн', 'root'],
  ['карма#ый фонарик', 'нн', 'root'], ['дли#ый коридор', 'нн', 'root'],
  ['стекля#ая ваза', 'нн', 'ex1'], ['оловя#ый солдатик', 'нн', 'ex1'], ['деревя#ый дом', 'нн', 'ex1'],
  ['ветре#ый день', 'н', 'ex2'], ['безветре#ый день', 'нн', 'ex2', 'Безветренный — с приставкой, НН. А ветреный — исключение с одной Н.'],
  ['ю#ый художник', 'н', 'ex2'], ['сви#ая отбивная', 'н', 'ex2'], ['румя#ые щёки', 'н', 'ex2'], ['пря#ый аромат', 'н', 'ex2'],
  ['багря#ый закат', 'н', 'ex2'], ['зелё#ая трава', 'н', 'ex2'],
  /* причастия и отглагольные прилагательные */
  ['жаре#ая картошка', 'н', 'adj'], ['жаре#ая на масле картошка', 'нн', 'part', 'Есть зависимое слово «на масле» — это причастие.'],
  ['пожаре#ая картошка', 'нн', 'part', 'Приставка по- — это причастие.'], ['кваше#ая капуста', 'н', 'adj'], ['засоле#ые огурцы', 'нн', 'part'],
  ['солё#ые огурцы', 'н', 'adj'], ['краше#ый забор', 'н', 'adj'], ['выкраше#ый забор', 'нн', 'part'], ['краше#ый зелёной краской забор', 'нн', 'part', 'Зависимое слово «зелёной краской» делает слово причастием.'],
  ['ране#ый боец', 'н', 'adj'], ['ране#ый в руку боец', 'нн', 'part'], ['маринова#ые грибы', 'нн', 'part', 'Суффикс -ова- — всегда НН.'],
  ['асфальтирова#ая дорога', 'нн', 'part'], ['балова#ый ребёнок', 'нн', 'part', 'Балованный — суффикс -ова-, поэтому НН.'],
  ['плетё#ая корзина', 'н', 'adj'], ['сплетё#ая из лозы корзина', 'нн', 'part'], ['вяза#ый свитер', 'н', 'adj'], ['связа#ый бабушкой свитер', 'нн', 'part'],
  ['гружё#ая баржа', 'н', 'adj'], ['пута#ый ответ', 'н', 'adj'], ['запута#ый ответ', 'нн', 'part'], ['варё#ое мясо', 'н', 'adj'],
  ['сваре#ое мясо', 'нн', 'part'], ['сушё#ые грибы', 'н', 'adj'], ['высуше#ые грибы', 'нн', 'part'], ['стриже#ый газон', 'н', 'adj'],
  ['посеребрё#ая ложка', 'нн', 'part'], ['кипячё#ое молоко', 'н', 'adj'], ['вскипячё#ое молоко', 'нн', 'part'], ['мороже#ое мясо', 'н', 'adj'],
  ['замороже#ое мясо', 'нн', 'part'], ['рва#ые джинсы', 'н', 'adj'], ['изорва#ая рубашка', 'нн', 'part'], ['учё#ый совет', 'н', 'adj'],
  ['кова#ый сундук', 'н', 'kov'], ['подкова#ая лошадь', 'нн', 'kov', 'С приставкой — НН.'], ['жёва#ая бумага', 'н', 'kov'],
  ['решё#ая задача', 'нн', 'perf'], ['броше#ый котёнок', 'нн', 'perf'], ['купле#ая книга', 'нн', 'perf'], ['лишё#ый наследства', 'нн', 'perf'],
  ['пленё#ый солдат', 'нн', 'perf'], ['да#ое слово', 'нн', 'perf'],
  ['нежда#ый гость', 'нн', 'ex3'], ['невида#ая красота', 'нн', 'ex3'], ['неслыха#ая дерзость', 'нн', 'ex3'], ['медле#ый танец', 'нн', 'ex3'],
  ['свяще#ая клятва', 'нн', 'ex3'], ['чека#ый шаг', 'нн', 'ex3'], ['жема#ая улыбка', 'нн', 'ex3'], ['жела#ый подарок', 'нн', 'ex3'],
  ['смышлё#ый мальчик', 'н', 'ex4'], ['назва#ый брат', 'н', 'ex4'], ['посажё#ый отец', 'н', 'ex4'],
  ['некоше#ый луг', 'н', 'ne'], ['нескоше#ый луг', 'нн', 'ne'], ['некраше#ый пол', 'н', 'ne'],
  /* краткие формы и наречия */
  ['задача реше#а', 'н', 'short', 'Краткое причастие — одна Н.'], ['статья напечата#а', 'н', 'short', 'Краткое причастие — одна Н.'],
  ['комиссия образова#а приказом', 'н', 'short', 'Здесь «образована» — краткое причастие (создана), одна Н.'],
  ['девушка умна и образова#а', 'нн', 'short', 'Здесь «образованна» — краткое прилагательное (знающая), как в полной форме — НН.'],
  ['ночь тума#а', 'нн', 'short', 'Туманный — туманна.'], ['улицы пусты#ы', 'нн', 'short', 'Пустынный — пустынны.'],
  ['движения его увере#ы', 'нн', 'short', 'Уверенный (решительный) — уверенны.'],
  ['отвечал взволнова#о', 'нн', 'adv'], ['на улице ветре#о', 'н', 'adv', 'Ветреный — ветрено.'], ['смотрел растеря#о', 'нн', 'adv'],
  ['неожида#о пошёл снег', 'нн', 'adv'], ['слушал рассея#о', 'нн', 'adv'], ['действовали организова#о', 'нн', 'adv'],
  /* существительные */
  ['гости#ица у моря', 'н', 'noun', 'Гость + -ин- + -иц-: одна Н.'], ['ко#ица атакует', 'нн', 'noun', 'От «конный».'], ['праздновать Масле#ицу', 'н', 'noun', 'От «масленый».'],
  ['пьеса «Бесприда#ица»', 'нн', 'noun', 'От «бесприданный».'], ['песча#ик (камень)', 'н', 'noun', 'От «песчаный».'], ['ветре#ик и повеса', 'н', 'noun', 'От «ветреный».'],
  ['дружи#ик на посту', 'нн', 'noun', 'Дружина + -ник.'], ['мой племя#ик', 'нн', 'noun'], ['труже#ик тыла', 'н', 'noun'],
  ['варе#ики с вишней', 'н', 'noun', 'От «варёный».'], ['воспита#ик детсада', 'нн', 'noun', 'От «воспитанный».'], ['посла#ик Франции', 'нн', 'noun', 'От «посланный».'],
  ['путешестве#ик', 'нн', 'noun', 'Путешественник пишется с НН (суффикс -енник), как и современник.'], ['избра#ик народа', 'нн', 'noun', 'От «избранный».'],
];
const CAT_OF = { an: 'adj', enn: 'adj', root: 'adj', ex1: 'adj', ex2: 'adj', short: 'short', adv: 'short', noun: 'noun' };
Trainer.start({
  id: 'n-nn',
  kind: 'choice',
  title: 'Н и НН',
  eyebrow: 'ЕГЭ · задание 15 · Н и НН в разных частях речи',
  prompt: 'Сколько Н?',
  source: 'Правила — по школьному курсу и справочнику Д. Э. Розенталя.',
  options: ['н', 'нн'],
  categories: [
    { key: 'adj', label: 'Прилагательные' }, { key: 'verb', label: 'Причастия' },
    { key: 'short', label: 'Краткие и наречия' }, { key: 'noun', label: 'Существительные' },
  ],
  groups: GROUPS,
  ear: true,
  exam: { type: 'digits', task: 15, points: 1, count: 6, variants: [
    { q: 'Укажите все цифры, на месте которых пишется НН.', pick: 'нн' },
    { q: 'Укажите все цифры, на месте которых пишется одна буква Н.', pick: 'н' },
  ] },
  items: N.map(([t, a, g, n]) => ({ t, a, g, n, c: CAT_OF[g] || 'verb' })),
});
</script>
