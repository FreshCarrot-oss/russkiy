<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 11</h3>
    <p>Пять рядов слов с пропущенной буквой в суффиксе. Нужно выбрать ряды, где во всех словах пропущена одна и та же буква. Суффиксы -Н- и -НН- сюда не входят, для них есть задание 15.</p>
  </article>
  <article class="card rule">
    <h3>Главные приёмы</h3>
    <ul>
      <li><b>-ек/-ик:</b> просклоняй слово. Гласная выпадает — пиши Е (замочек — замочка), остаётся — И (ключик — ключика).</li>
      <li><b>-ова-/-ева- или -ыва-/-ива-:</b> поставь глагол в форму «я». Если «-ую/-юю» — пиши -ова-/-ева- (командую — командовать). Если «-ываю/-иваю» — пиши -ыва-/-ива- (рассказываю — рассказывать).</li>
      <li><b>-ичк-/-ечк-:</b> -ичк- пишется, если слово образовано от слова на -иц-: лестница — лестничка. В остальных случаях -ечк-: семечко, Ванечка.</li>
      <li><b>Суффиксы наречий:</b> с приставками из-, до-, с- на конце А (изредка, досуха, справа), с приставками в-, на-, за- — О (влево, направо, засветло).</li>
      <li><b>-чик/-щик:</b> после Д, Т, З, С, Ж пишется -чик (переводчик, лётчик), в остальных случаях -щик (каменщик, кровельщик).</li>
    </ul>
  </article>
</template>
