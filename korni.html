<body>
<div id="app"></div>

<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 9</h3>
    <p>Даны пять рядов по три слова с пропущенной буквой в корне. Нужно выбрать все ряды, где во всех словах пропущена одна и та же буква.</p>
    <ul>
      <li>В одном ряду могут встретиться разные виды корней: проверяемый, чередующийся и словарный.</li>
      <li>Иногда в скобках дан контекст: «(члены) ж..ри», «отв..рить (картофель)». Он подсказывает значение и нужное проверочное слово.</li>
      <li>Сначала определи вид корня, потом применяй правило. Проверочное слово для чередующегося корня не подбирают.</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Алгоритм</h3>
    <ol style="margin:0;padding-left:20px;display:grid;gap:4px">
      <li>Корень из списка чередующихся? Применяй правило этого корня.</li>
      <li>Нет — подбери однокоренное слово, где гласная под ударением: г<mark>о</mark>ристый — г<mark>о</mark>ры.</li>
      <li>Проверить нельзя — это словарное слово, его пишут по памяти.</li>
    </ol>
  </article>
  <article class="card rule">
    <h3>Чередующиеся корни</h3>
    <div class="tablewrap"><table class="t">
      <tr><th>От чего зависит</th><th>Корни</th></tr>
      <tr><td>От суффикса -а- после корня</td><td>-кас-/-кос-, -бер-/-бир-, -мер-/-мир-, -стел-/-стил-, -блест-/-блист-, -жег-/-жиг-, -тер-/-тир-, -пер-/-пир-, -чет-/-чит-</td></tr>
      <tr><td>От согласной в конце корня</td><td>-лаг-/-лож-, -раст-/-ращ-/-рос-, -скак-/-скоч-</td></tr>
      <tr><td>От ударения</td><td>-гар-/-гор-, -зар-/-зор-, -клан-/-клон-, -твар-/-твор-, -плав-/-плов-</td></tr>
      <tr><td>От значения</td><td>-мак-/-моч-, -равн-/-ровн-</td></tr>
    </table></div>
  </article>
</template>

<script src="assets/core.js"></script>
<script src="assets/trainer.js"></script>
<script>
const GROUPS = {
  lag:  { h: '-лаг-/-лож-', p: 'Перед Г пишется А, перед Ж — О: предлагать, положить. Исключение: полог.' },
  kas:  { h: '-кас-/-кос-', p: 'Если после корня суффикс -а-, пишется А: касаться; иначе О: коснуться.' },
  bir:  { h: 'Корни с Е/И (-бер-/-бир-, -мер-/-мир-, -стел-/-стил- и др.)', p: 'Если после корня суффикс -а-, пишется И: собирать, замирать, застилать; иначе Е: соберу, замереть, застелить. Исключения: сочетать, сочетание.' },
  rast: { h: '-раст-/-ращ-/-рос-', p: 'Перед СТ и Щ пишется А: расти, выращенный; в остальных случаях О: вырос. Исключения: росток, ростовщик, отрасль, Ростов.' },
  skak: { h: '-скак-/-скоч-', p: 'Перед К пишется А, перед Ч — О: скакать, выскочить. Исключения: скачок, скачу.' },
  gar:  { h: '-гар-/-гор-', p: 'Без ударения пишется О: загорать, угореть. Исключения: выгарки, изгарь, пригарь.' },
  zar:  { h: '-зар-/-зор-', p: 'Без ударения пишется А: зарница, озарённый. Исключения: зоревать, зорянка.' },
  klan: { h: '-клан-/-клон- и -твар-/-твор-', p: 'Без ударения пишется О: наклониться, творение. Исключение: утварь.' },
  plav: { h: '-плав-/-плов-', p: 'Без ударения пишется А: плавучий, плавник. Исключения: пловец, пловчиха, плывуны.' },
  mak:  { h: '-мак-/-моч-', p: 'МАК — погружать в жидкость (обмакнуть перо), МОК — пропускать жидкость, намокать (промокнуть, непромокаемый).' },
  ravn: { h: '-равн-/-ровн-', p: 'РАВН — равный, одинаковый (уравнять в правах), РОВН — ровный, гладкий (выровнять дорогу). Исключения: равнина, ровесник, поровну, ровня.' },
  chk:  { h: 'Проверяемая гласная', p: 'Подбери однокоренное слово, где эта гласная под ударением.' },
  ctx:  { h: 'Проверка зависит от смысла', p: 'Одинаково звучащие слова пишутся по-разному. Значение подсказывает, каким словом проверять.' },
  dict: { h: 'Словарное слово', p: 'Проверить нельзя, написание запоминают. Часто это заимствованные слова.' },
  ju:   { h: 'У и Ю в заимствованиях', p: 'После Ж и Ш в словах из других языков бывает Ю: жюри, парашют, брошюра. Также запомни: бюллетень, жюльен. В русских словах — У: шуба, журнал, шуруп.' },
};
/* [текст с пропуском #, буква, варианты, группа, пояснение] */
const K = [
  /* чередующиеся */
  ['пол#жить', 'о', 'а|о', 'lag'], ['предл#гать', 'а', 'а|о', 'lag'], ['изл#жение', 'о', 'а|о', 'lag'], ['прил#гательное', 'а', 'а|о', 'lag'],
  ['к#снуться', 'о', 'а|о', 'kas'], ['прик#саться', 'а', 'а|о', 'kas'], ['к#сательная (линия)', 'а', 'а|о', 'kas'],
  ['соб#ру', 'е', 'е|и', 'bir', 'Соберу: после корня нет суффикса -а-.'],
  ['отб#рать', 'и', 'е|и', 'bir', 'Отбирать: после корня суффикс -а-.'],
  ['зам#реть', 'е', 'е|и', 'bir'], ['зам#рать', 'и', 'е|и', 'bir'], ['заст#лить', 'е', 'е|и', 'bir'], ['заст#лать', 'и', 'е|и', 'bir'],
  ['бл#стать', 'и', 'е|и', 'bir'], ['бл#стящий', 'е', 'е|и', 'bir'], ['раст#реть', 'е', 'е|и', 'bir'], ['раст#рать', 'и', 'е|и', 'bir'],
  ['зап#реть', 'е', 'е|и', 'bir'], ['зап#рать', 'и', 'е|и', 'bir'], ['заж#гать', 'и', 'е|и', 'bir'], ['выч#тание', 'и', 'е|и', 'bir'],
  ['соч#тать', 'е', 'е|и', 'bir', 'Исключение: сочетать, сочетание — пишется Е, хотя есть суффикс -а-.'],
  ['выр#сти', 'а', 'а|о', 'rast'], ['выр#щенный', 'а', 'а|о', 'rast'], ['выр#с', 'о', 'а|о', 'rast'], ['нар#стание', 'а', 'а|о', 'rast'],
  ['р#сток', 'о', 'а|о', 'rast', 'Исключение: росток, хотя перед СТ.'], ['отр#сль', 'а', 'а|о', 'rast', 'Исключение: отрасль.'],
  ['ск#кать', 'а', 'а|о', 'skak'], ['выск#чить', 'о', 'а|о', 'skak'], ['ск#чок', 'а', 'а|о', 'skak', 'Исключение: скачок, хотя перед Ч.'],
  ['заг#рать', 'о', 'а|о', 'gar'], ['уг#реть', 'о', 'а|о', 'gar'], ['приг#рь', 'а', 'а|о', 'gar', 'Исключение: пригарь.'],
  ['з#рница', 'а', 'а|о', 'zar'], ['оз#рённый', 'а', 'а|о', 'zar'], ['з#ревать', 'о', 'а|о', 'zar', 'Исключение: зоревать.'],
  ['накл#ниться', 'о', 'а|о', 'klan'], ['скл#нение', 'о', 'а|о', 'klan'], ['тв#рение', 'о', 'а|о', 'klan'], ['утв#рь', 'а', 'а|о', 'klan', 'Исключение: утварь.'],
  ['пл#вучий', 'а', 'а|о', 'plav'], ['пл#вник', 'а', 'а|о', 'plav'], ['пл#вец', 'о', 'а|о', 'plav', 'Исключение: пловец.'],
  ['обм#кнуть перо в чернила', 'а', 'а|о', 'mak'], ['пром#кнуть под дождём', 'о', 'а|о', 'mak'], ['непром#каемый плащ', 'о', 'а|о', 'mak'],
  ['ур#внять в правах', 'а', 'а|о', 'ravn'], ['выр#внять дорогу', 'о', 'а|о', 'ravn'], ['р#внина', 'а', 'а|о', 'ravn', 'Исключение: равнина.'], ['р#весник', 'о', 'а|о', 'ravn', 'Исключение: ровесник.'],
  /* проверяемые */
  ['г#ристый', 'о', 'а|о', 'chk', 'Горы. Это не чередующийся корень -гар-/-гор-: здесь значение «гора».'],
  ['ст#рожил', 'а', 'а|о', 'chk', 'Старый.'], ['обл#котиться', 'о', 'а|о', 'chk', 'Локоть.'], ['насл#ждаться', 'а', 'а|о', 'chk', 'Сладкий.'],
  ['пох#дка', 'о', 'а|о', 'chk', 'Ходит.'], ['выт#птать', 'о', 'а|о', 'chk', 'Топчет.'], ['сокр#щение', 'а', 'а|о', 'chk', 'Краткий.'],
  ['огр#ничение', 'а', 'а|о', 'chk', 'Грань.'], ['оп#здание', 'о', 'а|о', 'chk', 'Поздно.'], ['обог#щение', 'а', 'а|о', 'chk', 'Богатый.'],
  ['заг#ворить', 'о', 'а|о', 'chk', 'Говор.'], ['зат#ить дыхание', 'а', 'а|о', 'chk', 'Тайна.'],
  ['осв#тить', 'е', 'е|и', 'chk', 'Свет.'], ['прибл#жение', 'и', 'е|и', 'chk', 'Близко.'], ['изм#рение', 'е', 'е|и', 'chk', 'Мера.'],
  ['пос#деть', 'е', 'е|и', 'chk', 'Седой.'], ['л#сник', 'е', 'е|и', 'chk', 'Лес.'], ['в#сна', 'е', 'е|и', 'chk', 'Вёсны.'],
  ['изл#чение', 'е', 'е|и', 'chk', 'Лечит.'], ['прим#рение сторон', 'и', 'е|и', 'chk', 'Мир.'], ['ув#дать', 'я', 'е|я', 'chk', 'Вянуть.'],
  /* зависит от смысла */
  ['пол#скать бельё', 'о', 'а|о', 'ctx', 'Полоскать (бельё) — словарное, проверить нельзя. Не путай с «поласкать котёнка» — ласка.'],
  ['пол#скать котёнка', 'а', 'а|о', 'ctx', 'Поласкать — ласка. Не путай с «полоскать бельё».'],
  ['ум#лять о помощи', 'о', 'а|о', 'ctx', 'Умолять — молит. Не путай с «умалять достоинства» — малый.'],
  ['ум#лять достоинства', 'а', 'а|о', 'ctx', 'Умалять — малый (делать меньше). Не путай с «умолять» — молить.'],
  ['прим#рять платье', 'е', 'е|и', 'ctx', 'Примерять — мерка. Не путай с «примирять соседей» — мир.'],
  ['прим#рять соседей', 'и', 'е|и', 'ctx', 'Примирять — мир. Не путай с «примерять платье» — мерка.'],
  ['посв#тить фонариком', 'е', 'е|я', 'ctx', 'Посветить — свет. Не путай с «посвятить себя науке» — святой.'],
  ['посв#тить себя науке', 'я', 'е|я', 'ctx', 'Посвятить — святой. Не путай с «посветить фонариком».'],
  ['разр#дить ружьё', 'я', 'е|я', 'ctx', 'Разрядить — заряд, разряд.'],
  ['разр#дить рассаду', 'е', 'е|я', 'ctx', 'Разредить — редкий.'],
  ['отв#рить картофель', 'а', 'а|о', 'ctx', 'Отварить — варка, варит.'],
  /* словарные */
  ['инт#ллигенция', 'е', 'е|и', 'dict'], ['д#рижёр', 'и', 'е|и', 'dict'], ['ф#стиваль', 'е', 'е|и', 'dict'], ['в#негрет', 'и', 'е|и', 'dict'],
  ['инт#рвью', 'е', 'е|и', 'dict'], ['ст#пендия', 'и', 'е|и', 'dict'], ['эл#мент', 'е', 'е|и', 'dict'], ['ап#ллировать', 'е', 'е|и', 'dict'],
  ['п#рила', 'е', 'е|и', 'dict'], ['ж#лезо', 'е', 'е|и', 'dict'],
  ['к#мпьютер', 'о', 'а|о', 'dict'], ['к#нфорка', 'о', 'а|о', 'dict'], ['к#ридор', 'о', 'а|о', 'dict'], ['г#ризонт', 'о', 'а|о', 'dict'],
  ['дек#рация', 'о', 'а|о', 'dict'], ['к#нкретный', 'о', 'а|о', 'dict'], ['к#мплимент', 'о', 'а|о', 'dict', 'Комплимент — похвала. Не путай с «комплемент» (дополнение в науке).'],
  ['п#норама', 'а', 'а|о', 'dict'], ['б#гровый', 'а', 'а|о', 'dict'], ['ш#колад', 'о', 'а|о', 'dict'], ['к#мпания друзей', 'о', 'а|о', 'dict'],
  ['параш#т', 'ю', 'у|ю', 'ju'], ['брош#ра', 'ю', 'у|ю', 'ju'], ['(члены) ж#ри', 'ю', 'у|ю', 'ju'], ['б#ллетень', 'ю', 'у|ю', 'ju'], ['ж#льен', 'ю', 'у|ю', 'ju'],
  ['ш#руп', 'у', 'у|ю', 'ju'], ['ж#рнал', 'у', 'у|ю', 'ju'], ['ш#ба', 'у', 'у|ю', 'ju'],
];
const CAT_OF = { chk: 'check', ctx: 'check', dict: 'dict', ju: 'dict' };
Trainer.start({
  id: 'korni',
  kind: 'choice',
  title: 'Гласные в корне',
  eyebrow: 'ЕГЭ · задание 9 · правописание корней',
  prompt: 'Вставь букву',
  source: 'Правила — по школьному курсу и справочнику Д. Э. Розенталя.',
  categories: [{ key: 'alt', label: 'Чередующиеся' }, { key: 'check', label: 'Проверяемые' }, { key: 'dict', label: 'Словарные' }],
  groups: GROUPS,
  ear: true,
  exam: { type: 'rows', task: 9, per: 3, points: 1 },
  items: K.map(([t, a, o, g, n]) => ({ t, a, o: o.split('|'), g, n, c: CAT_OF[g] || 'alt' })),
});
</script>
