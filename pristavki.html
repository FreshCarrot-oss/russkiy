    <h3>Как устроено задание 10</h3>
    <p>Пять рядов по три слова, в каждом пропущена буква в приставке или на стыке приставки и корня. Нужно выбрать ряды, где во всех словах пропущена одна и та же буква.</p>
    <p>В задание попадают: З/С на конце приставки, ПРЕ/ПРИ, Ы/И после приставки, Ъ/Ь, неизменяемые приставки (с-, о-, про-, по-, над-, под-, от-) и РАЗ/РОЗ.</p>
  </article>
