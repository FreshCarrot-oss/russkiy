    <h3>Как устроено задание 7</h3>
    <p>Даны пять словосочетаний, в каждом одно слово выделено прописными буквами. В одном из выделенных слов допущена ошибка. Нужно исправить её и записать слово правильно.</p>
    <ul>
      <li>С 2026 года в формулировке говорится о <b>грамматической</b> ошибке: кроме форм слова могут встретиться и другие нарушения, например «запечатлить» вместо «запечатлеть».</li>
      <li>Ответ записывается в той же форме, только исправленной: «пара НОСОК» → «носков».</li>
      <li>Чаще всего проверяют родительный падеж множественного числа, числительные, степени сравнения и повелительное наклонение.</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Родительный падеж множественного числа</h3>
    <div class="tablewrap"><table class="t">
      <tr><th>Без окончания</th><th>С окончанием -ов</th></tr>
      <tr><td>парная обувь: сапог, ботинок, валенок, чулок, туфель</td><td>носков</td></tr>
      <tr><td>народы: грузин, армян, башкир, татар, цыган, осетин</td><td>якутов, монголов, киргизов, таджиков</td></tr>
      <tr><td>воинские группы: солдат, партизан, гусар, драгун</td><td>минёров, сапёров</td></tr>
      <tr><td>яблок, полотенец, блюдец, вафель, кочерёг, сплетен, басен</td><td>апельсинов, мандаринов, помидоров, баклажанов, томатов</td></tr>
    </table></div>
    <p>Ещё формы, которые стоит запомнить: нянь, вишен, сабель, серёг, саней, мест, но дядей, тётей, свечей, яслей.</p>
  </article>
  <article class="card rule">
    <h3>Числительные</h3>
    <ul>
      <li>Склоняются обе части: <b>пятисот</b>, <b>пятьюстами</b>, <b>о восьмистах</b>, <b>семьюдесятью</b>.</li>
      <li><b>Оба</b> — с мужским и средним родом (обоих братьев), <b>обе</b> — с женским (обеих сестёр, обеими руками).</li>
      <li><b>Полтора</b> в косвенных падежах — <b>полутора</b>: более полутора километров.</li>
      <li>Собирательные (двое, трое…) не сочетаются с существительными женского рода: три подруги, а не трое подруг. Зато обязательны с существительными, у которых нет единственного числа: трое ножниц, двое суток.</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Степени сравнения</h3>
    <p>Простая форма (короче, лучше, высочайший) и составная (более короткий, самый высокий) не смешиваются. Ошибки: <b>более короче</b>, <b>самый высочайший</b>.</p>
  </article>
  <article class="card rule">
    <h3>Глаголы</h3>
    <ul>
      <li>Повелительное наклонение: ляг, поезжай, положи, выложи, вымой, выйди, порежь. Не бывает: ляжь, ехай, ложи.</li>
      <li>Личные формы: машет, жжёт, печёт, хотят, хотим, кладёт.</li>
      <li>Прошедшее время многих глаголов на -нуть — без -ну-: окреп, исчез, погиб, высохла.</li>
    </ul>
