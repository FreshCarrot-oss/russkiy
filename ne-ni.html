<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 13</h3>
    <p>Даны пять предложений или словосочетаний, где НЕ стоит в скобках: «(не)знал». Нужно выбрать все варианты, где НЕ пишется слитно. Иногда спрашивают наоборот — где раздельно. Читай формулировку внимательно.</p>
  </article>
  <article class="card rule">
    <h3>Порядок рассуждения</h3>
    <ol style="margin:0;padding-left:20px;display:grid;gap:4px">
      <li>Слово без НЕ не употребляется (ненавидеть, нелепый, невежда) — слитно.</li>
      <li>Глагол, деепричастие, числительное, сравнительная степень — раздельно (не знал, не зная, не два, не выше). Исключение: глаголы с недо- в значении «меньше нормы» (недоедать).</li>
      <li>Причастие: полное без зависимых слов — слитно (непрочитанная книга), с зависимыми или краткое — раздельно (не прочитанная мной; книга не прочитана).</li>
      <li>Существительное, прилагательное, наречие на -о: есть синоним без НЕ — слитно (неправда = ложь); есть противопоставление с «а» — раздельно (не правда, а ложь).</li>
      <li>Перед словом стоит «вовсе», «далеко», «отнюдь», «ничуть» — раздельно (вовсе не интересный).</li>
      <li>Отрицательные местоимения: без предлога слитно (некого), с предлогом раздельно (не с кем).</li>
    </ol>
  </article>
  <article class="card rule">
    <h3>НЕ или НИ</h3>
    <ul>
      <li><b>НЕ</b> — отрицание: не знал. Двойное НЕ дает утверждение: не мог не сказать (= сказал).</li>
      <li><b>НИ</b> — усиление отрицания: ни разу, ни с места, нет ни копейки. И в оборотах с уступкой: как ни старался, кто ни придёт.</li>
      <li>Сравни: <b>не раз</b> (много раз) — <b>ни разу</b> (ни одного раза); <b>не один</b> (много) — <b>ни один</b> (никто).</li>
    </ul>
  </article>
</template>

<script src="assets/trainer.js"></script>
<script>
const SEP = ' ';
const GROUPS = {
  never:  { h: 'Без НЕ не употребляется', p: 'Слово не существует без НЕ — пишется слитно.' },
  syn:    { h: 'Можно заменить синонимом без НЕ', p: 'Существительное, прилагательное или наречие на -о, которое можно заменить синонимом без НЕ, пишется слитно: неправда — ложь.' },
  contr:  { h: 'Есть противопоставление', p: 'Если есть или подразумевается противопоставление с союзом «а», пишется раздельно: не большой, а огромный.' },
  verb:   { h: 'Глагол и деепричастие', p: 'С глаголами и деепричастиями НЕ пишется раздельно. Исключение — глаголы с приставкой недо- со значением «меньше нормы»: недоедать, недосыпать.' },
  partS:  { h: 'Полное причастие без зависимых слов', p: 'Пишется слитно: нерешённая задача.' },
  partD:  { h: 'Причастие с зависимыми словами или краткое', p: 'Пишется раздельно: не решённая вовремя задача; задача не решена.' },
  pron:   { h: 'Местоимения', p: 'Отрицательные местоимения без предлога пишутся слитно (некого, нечего, некогда), с предлогом — раздельно (не с кем, не о чем). Остальные местоимения с НЕ — раздельно: не я, не тот.' },
  num:    { h: 'Числительное и сравнительная степень', p: 'Раздельно: не два, не выше.' },
  strong: { h: 'Усиление: вовсе, далеко, отнюдь, ничуть', p: 'Если перед словом стоят «вовсе», «далеко», «отнюдь», «ничуть», НЕ пишется раздельно.' },
  prep:   { h: 'Предлоги и наречия', p: 'Несмотря на, невзирая на — предлоги, пишутся слитно. Но «не смотря в глаза» — деепричастие, раздельно.' },
  ni:     { h: 'НЕ или НИ', p: 'НЕ отрицает, НИ усиливает отрицание и входит в обороты с уступкой (как ни старался).' },
};
/* [текст с # на месте НЕ, слитно?, группа, пояснение] */
const NE = [
  ['#навидеть ложь', 1, 'never'], ['#годовать по пустякам', 1, 'never'], ['#лепый поступок', 1, 'never'], ['#брежный почерк', 1, 'never'],
  ['#вежда в науке', 1, 'never'], ['пережить #взгоды', 1, 'never'], ['#ряшливый вид', 1, 'never'], ['мне #здоровится', 1, 'never'],
  ['#доумевать', 1, 'never'], ['#дюжинный талант', 1, 'syn', 'Недюжинный = выдающийся.'], ['#чаянно задел', 1, 'never'], ['#вдалеке от дома', 1, 'syn', 'Невдалеке = близко.'],
  ['#подалёку от школы', 1, 'never'],
  ['#большой дом', 1, 'syn', 'Небольшой = маленький.'], ['#большой, а огромный дом', 0, 'contr'],
  ['сказал #правду', 1, 'syn', 'Неправда = ложь.'], ['это #правда, а ложь', 0, 'contr'],
  ['летел #высоко', 1, 'syn', 'Невысоко = низко.'], ['летел #высоко, а низко', 0, 'contr'],
  ['#интересный фильм', 1, 'syn', 'Неинтересный = скучный.'], ['вовсе #интересный фильм', 0, 'strong'],
  ['далеко #простая задача', 0, 'strong'], ['отнюдь #глупый вопрос', 0, 'strong'], ['ничуть #страшно', 0, 'strong'],
  ['#приятель окружил город', 1, 'syn', 'Неприятель = враг.'], ['задача #сложна', 1, 'syn', 'Краткое прилагательное без противопоставления — как полное: несложна = проста.'],
  ['задача #сложна, а проста', 0, 'contr'], ['#весел, а грустен', 0, 'contr'], ['#давно приехал', 1, 'syn', 'Недавно = только что.'],
  ['#знал правила', 0, 'verb'], ['#зная правил', 0, 'verb'], ['#был в театре', 0, 'verb'], ['мне #хватает времени', 0, 'verb'],
  ['#спеша шёл домой', 0, 'verb'], ['#смотря в глаза', 0, 'verb', 'Здесь деепричастие от «смотреть» — раздельно.'],
  ['#доедать в детстве', 1, 'verb', 'Недоедать — есть меньше нормы, приставка недо-.'],
  ['#досыпать перед экзаменом', 1, 'verb', 'Недосыпать — спать меньше нормы.'],
  ['#прочитанная книга', 1, 'partS'], ['#прочитанная мною книга', 0, 'partD'], ['книга #прочитана', 0, 'partD'],
  ['#решённые задачи', 1, 'partS'], ['#решённые вовремя задачи', 0, 'partD'], ['#законченный рисунок', 1, 'partS'],
  ['#законченный автором рисунок', 0, 'partD'], ['#скошенный луг', 1, 'partS'], ['#замеченная никем ошибка', 0, 'partD'],
  ['#с кем поговорить', 0, 'pron'], ['#кого спросить', 1, 'pron'], ['#чем заняться', 1, 'pron'], ['#о чем говорить', 0, 'pron'],
  ['#когда отдыхать', 1, 'pron'], ['#куда пойти', 1, 'pron'], ['#зачем спорить', 1, 'pron'], ['#я виноват', 0, 'pron'],
  ['#два, а три', 0, 'num'], ['#выше брата', 0, 'num'], ['#лучше прежнего', 0, 'num'],
  ['#смотря на дождь', 1, 'prep', 'Несмотря на — предлог (можно заменить на «вопреки»).'], ['#взирая на трудности', 1, 'prep'],
  ['острая #хватка денег', 1, 'syn', 'Нехватка = недостаток.'],
];
/* [текст с # вместо буквы, буква, пояснение] */
const NI = [
  ['н# разу не был', 'и', 'Ни разу — ни одного раза.'], ['н# раз бывал здесь', 'е', 'Не раз — много раз.'],
  ['как н# старался', 'и', 'Уступительный оборот: как ни старался.'], ['кто н# придёт, все рады', 'и', 'Уступка: кто ни придёт.'],
  ['н# с места!', 'и', 'Устойчивое выражение с НИ.'], ['нет н# копейки', 'и', 'НИ усиливает отрицание.'],
  ['не мог н# сказать', 'е', 'Двойное НЕ: не мог не сказать = сказал.'], ['н# один не пришёл', 'и', 'Ни один — никто.'],
  ['н# один день прошёл', 'е', 'Не один — много.'], ['куда н# посмотришь', 'и', 'Уступка.'],
  ['н# жив н# мёртв', 'и', 'Устойчивое выражение: ни жив ни мёртв.'], ['н# то н# сё', 'и', 'Устойчивое выражение.'],
];
Trainer.start({
  id: 'ne-ni',
  kind: 'choice',
  title: 'НЕ и НИ',
  eyebrow: 'ЕГЭ · задание 13 · правописание НЕ и НИ',
  prompt: 'Слитно или раздельно?',
  source: 'Правила — по школьному курсу и справочнику Д. Э. Розенталя.',
  options: ['не', 'не' + SEP],
  optionNames: { 'не': 'слитно', ['не' + SEP]: 'раздельно' },
  gapText: 'не',
  paren: true,
  autoNext: true,
  categories: [{ key: 'ne', label: 'НЕ: слитно или раздельно' }, { key: 'ni', label: 'НЕ или НИ' }],
  groups: GROUPS,
  ear: true,
  exam: { type: 'select', task: 13, per: 1, points: 1, variants: [
    { q: 'Укажите варианты ответов, в которых НЕ со словом пишется СЛИТНО. Запишите номера ответов.', pick: 'не' },
    { q: 'Укажите варианты ответов, в которых НЕ со словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', pick: 'не' + SEP },
  ] },
  items: NE.map(([t, tog, g, n]) => ({ t, a: tog ? 'не' : 'не' + SEP, g, n, c: 'ne' }))
    .concat(NI.map(([t, a, n]) => ({ t, a, o: ['е', 'и'], g: 'ni', n, c: 'ni' }))),
});
</script>
