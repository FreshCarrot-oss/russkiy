<template id="rules">
  <article class="card rule">
    <h3>Как устроено задание 12</h3>
    <p>Пять рядов по два слова: личные формы глаголов и причастия. Нужно выбрать ряды, где в обоих словах пропущена одна и та же буква.</p>
  </article>
  <article class="card rule">
    <h3>Как определить спряжение</h3>
    <ol style="margin:0;padding-left:20px;display:grid;gap:4px">
      <li>Если окончание ударное — по нему всё слышно: несёшь — I, стоишь — II.</li>
      <li>Если безударное — поставь глагол в начальную форму. На -ить — II спряжение (кроме брить, стелить). Остальные — I, кроме 11 исключений.</li>
      <li>Исключения II спряжения: гнать, держать, дышать, слышать, обидеть, видеть, ненавидеть, зависеть, вертеть, терпеть, смотреть.</li>
    </ol>
    <div class="ab">
      <div><b>I спряжение</b><span>-ешь, -ет, -ем, -ете, -ут/-ют</span></div>
      <div><b>II спряжение</b><span>-ишь, -ит, -им, -ите, -ат/-ят</span></div>
    </div>
  </article>
  <article class="card rule">
    <h3>Суффиксы причастий</h3>
    <ul>
      <li>Действительные настоящего времени: от глаголов I спряжения -ущ-/-ющ- (колышущийся), II спряжения -ащ-/-ящ- (клеящий).</li>
      <li>Страдательные настоящего времени: I спряжение -ем- (колеблемый), II спряжение -им- (видимый). Запомни: движимый.</li>
      <li>Страдательные прошедшего времени: от глаголов на -ать/-ять — -анн-/-янн- (посеянный, завешанный), от остальных — -енн- (склеенный, завешенный).</li>
    </ul>
  </article>
  <article class="card rule">
    <h3>Выйдете или выйдите</h3>
    <p>«Когда вы выйд<mark>е</mark>те» — будущее время, окончание по спряжению. «Выйд<mark>и</mark>те из класса!» — повелительное наклонение, всегда -ите.</p>
  </article>
</template>

  id: 'okonchaniya',

  title: 'Окончания и суффиксы причастий',
